# GitHub Actions CI 工作流
# 作用: 每次 push / PR 时, 在干净的 Ubuntu 机器上自动跑 pytest
# 跑的是纯逻辑单测 (test_unit_gps.py), UI 用例因无真机会自动跳过
# 文件位置必须是 .github/workflows/ 下, 文件名随意 (ci.yml)

name: CI

on:
  push:                # 推代码时触发
    branches: [master, main]
  pull_request:        # 提PR时触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试 (跳过UI)
        run: pytest -m "not ui" -v
