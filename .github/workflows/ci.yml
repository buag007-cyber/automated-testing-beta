# GitHub Actions CI 工作流
# 作用: 每次 push / PR 时, 在干净的 Ubuntu 机器上自动检查代码健康
#   1. 语法检查所有 .py
#   2. pytest 能正常收集全部用例 (导入无错)
# 说明: UI流程用例需要真机+Appium, CI 虚拟机没有, 所以只做收集级检查;
#       以后有真机 runner 再扩展为真跑

name: CI

on:
  push:                # 推代码时触发
    branches: [master, main]
  pull_request:        # 提PR时触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法检查所有py
        run: python -m compileall -q .

      - name: pytest 用例收集检查
        run: pytest --collect-only -q
